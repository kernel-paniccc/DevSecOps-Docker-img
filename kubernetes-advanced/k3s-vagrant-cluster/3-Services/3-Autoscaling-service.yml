apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-web-deployment-autoscaling
  labels:
    app: my-k3s-prod
    env: prod
    owner: admin
spec:
  replicas: 1
  selector:
    matchLabels:
      project: atl
  template:
    metadata:
      labels:
        project: atl
    spec:
      containers:
      - name: containers-prod
        image: kerne1paniiccc/simple_app_for_test_devops:latest
        ports:
          - containerPort: 8000

--- 
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: my-auto-scaling
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: my-web-deployment-autoscaling
  minReplicas: 2
  maxReplicas: 4
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
---
apiVersion: v1
kind: Service
metadata:
  name: my-service
  labels:
    app: my-k3s-prod
    env: prod
    owner: admin
spec:
  selector:
    project: atl
  ports:
  - name: listener
    protocol: TCP
    port: 8000
    targetPort: 8000
  type: LoadBalancer