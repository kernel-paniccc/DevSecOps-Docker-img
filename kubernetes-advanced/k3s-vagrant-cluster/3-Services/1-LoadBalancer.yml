apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-web-deployment
  labels:
    app: my-k3s-prod
    env: prod
    owner: admin
spec:
  replicas: 3
  selector:
    matchLabels:
      project: demo
  template:
    metadata:
      labels:
        project: demo # pods labels !!!!!!
    spec:
      containers:
      - name: containers-prod
        image: kerne1paniiccc/simple_app_for_test_devops:latest
        ports:
          - containerPort: 8000

---
apiVersion: v1
kind: Service
metadata:
  name: my-service
  labels:
    app: my-k3s-prod
    env: prod
    owner: admin
spec:
  selector:
    project: demo # pods labels !!!!!!
  ports:
  - name: listener
    protocol: TCP
    port: 8000
    targetPort: 8000
  type: LoadBalancer