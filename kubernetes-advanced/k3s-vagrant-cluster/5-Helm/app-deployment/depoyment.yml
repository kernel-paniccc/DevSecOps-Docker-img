apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: my-web-deployment-replicaset
  labels:
    app: my-k3s-prod
    env: prod
    owner: admin
spec:
  replicas: 3
  selector:
    matchLabels:
      project: demo-rst
  template:
    metadata:
      labels:
        project: demo-rst
    spec:
      containers:
      - name: containers-prod
        image: kerne1paniiccc/simple_app_for_test_devops:latest
        ports:
          - containerPort: 8000
